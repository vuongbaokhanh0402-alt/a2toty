<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A2 IN MY HEART</title>

<!-- ================= STYLE ================= -->
<style>
html,body{
  margin:0;
  padding:0;
  background:black;
  font-family:arial;
  overflow:hidden;
  color:white;
}
/* ===== LOADING SCENE ===== */
#loadingScene{
  position:fixed;
  inset:0;
  background:black;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.loading-box{
  text-align:center;
}

.spinner{
  width:64px;
  height:64px;
  border:6px solid rgba(255,255,255,.2);
  border-top-color:#ffd700;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

#loadingText{
  margin-top:14px;
  font-size:16px;
  opacity:.85;
}
/* ===== FLASH WHITE ===== */
#flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:9998;
}

/* animation flash */
.flash-anim{
  animation:flashWhite .35s ease-out forwards;
}
@keyframes flashWhite{
  0%{ opacity:0; }
  40%{ opacity:1; }
  100%{ opacity:0; }
}

/* ===== SHAKE CARD ===== */
.shake{
  animation:shake .45s ease-in-out;
}
@keyframes shake{
  0%{ transform:translate(-50%,-50%) scale(1); }
  20%{ transform:translate(-48%,-50%) scale(1.03); }
  40%{ transform:translate(-52%,-50%) scale(1.03); }
  60%{ transform:translate(-49%,-50%) scale(1.03); }
  80%{ transform:translate(-51%,-50%) scale(1.03); }
  100%{ transform:translate(-50%,-50%) scale(1); }
}
/* ===== BACKGROUND ===== */
#bgStart,#bgVideo,#bgFinal{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
#bgStart{
  background:url("assets/bg_start.jpg") center/cover no-repeat;
  z-index:-2;
}
#bgVideo,#bgFinal{ display:none; }

/* ===== PACK ===== */
#packImg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate3d(-50%,-50%,0) scale(1);
  height:min(88vh,680px);
  width:auto;
  animation:idle 2.5s infinite ease-in-out;
  pointer-events:none;
  will-change:transform,filter;
}

/* idle nhẹ */
@keyframes idle{
  0%{ transform:translate3d(-50%,-50%,0) scale(1); }
  50%{ transform:translate3d(-50%,-50%,0) scale(1.04); }
  100%{ transform:translate3d(-50%,-50%,0) scale(1); }
}

/* mở pack */
@keyframes packOpenAnim{
  0%{
    transform:translate3d(-50%,-50%,0) scale(1);
    filter:none;
  }
  40%{
    transform:translate3d(-50%,-50%,0) scale(1.05);
    filter:drop-shadow(0 0 12px rgba(255,255,255,.8));
  }
  100%{
    transform:translate3d(-50%,-50%,0) scale(0.92);
    filter:drop-shadow(0 0 18px rgba(255,255,255,.6));
  }
}
.pack-open{
  animation:packOpenAnim 2.2s ease forwards !important;
}

/* ===== CENTER ===== */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

/* ===== OPEN BTN ===== */
#openBtn{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  padding:16px 50px;
  font-size:20px;
  border:none;
  border-radius:50px;
  background:#ffd700;
  color:white;
  font-weight:bold;
}

/* ===== CARD ===== */
#card{ display:none; }
#card img{
  width: min(42vw, 360px); /* PC to hơn, mobile tự co */
  max-width: 90vw;
}

/* ===== INVENTORY ===== */
#inventoryBtn{
  position:fixed;
  top:10px;
  right:10px;
  font-size:24px;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:10px;
}
#inventory{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
  z-index:10;
}
#closeInv{
  position:absolute;
  top:10px;
  right:15px;
  font-size:24px;
}
#inventoryList{
  margin-top:40px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}
#inventoryList img{ width:90px; }

/* ===== ROTATE NOTICE ===== */
#rotateNotice{
  position:fixed;
  inset:0;
  background:black;
  color:white;
  display:none;
  z-index:9999;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:18px;
}
#rotateNotice span{
  font-size:48px;
  display:block;
  margin-bottom:12px;
}
#adminCardList img{
  width:70px;
  margin:6px;
  border:2px solid transparent;
  cursor:pointer;
}
#adminCardList img.selected{
  border-color:yellow;
}
</style>
</head>

<body>
<!-- ===== LOADING SCENE ===== -->
<div id="loadingScene">
  <div class="loading-box">
    <div class="spinner"></div>
    <div id="loadingText">Loading 0%</div>
  </div>
</div>
<!-- ===== POST CARD CUTSCENE (SPECIAL ONLY) ===== -->
<video id="postSpecialCutscene"
  src="assets/cutscene/special_after.mp4"
  style="
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:9999;
  "
  playsinline>
</video>
<!-- ===== ADMIN BUTTON ===== -->
<div id="adminBtn"
  style="position:fixed;bottom:10px;left:10px;
  font-size:14px;opacity:.4;cursor:pointer;z-index:20">
  ADMIN
</div>

<!-- ===== ADMIN PANEL ===== -->
<div id="adminPanel"
  style="position:fixed;inset:0;background:black;color:white;
  display:none;flex-direction:column;align-items:center;
  padding-top:20px;z-index:9999">

  <div id="closeAdmin"
    style="position:absolute;top:10px;right:15px;
    font-size:24px;cursor:pointer">✖</div>

  <h3>🔐 ADMIN PANEL</h3>
 
  <!-- LOGIN -->
  <div id="adminLogin">
    <input id="adminPass" type="password" placeholder="Admin password"
      style="padding:10px;font-size:16px">
    <button id="adminLoginBtn">LOGIN</button>
  </div>

  <!-- CONTROLS -->
  <div id="adminControls"
    style="display:none;width:90%;max-width:520px">

    <label style="display:block;margin:10px 0">
      <input type="checkbox" id="noDupToggle">
      Mở thẻ KHÔNG TRÙNG (theo kho)
    </label>
    <button id="resetInventoryBtn"
    style="
    margin:10px 0;
    padding:10px 16px;
    background:#c62828;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    ">
    🗑️ RESET KHO THẺ
    </button>
    <hr style="opacity:.2">

    <p>Chọn thẻ cho lần mở TIẾP THEO:</p>
    <div id="adminCardList"
      style="display:flex;flex-wrap:wrap;justify-content:center">
    </div>
    <button id="forceSpecialBtn"
     style="
      margin:12px 0;
      padding:12px 18px;
      background:linear-gradient(45deg,#ffd700,#ff9800);
      color:black;
      border:none;
      border-radius:8px;
      font-weight:900;
      cursor:pointer;
     ">
     ⭐ CHỌN THẺ ĐẶC BIỆT
    </button>

    <hr style="opacity:.3">
  </div>
</div>
<div id="flash"></div>
<!-- ===== ROTATE ===== -->
<div id="rotateNotice">
  <div>
    <span>📱↔️</span>
    Vui lòng xoay ngang màn hình<br>để tiếp tục
  </div>
</div>

<!-- ===== BG ===== -->
<div id="bgStart"></div>
<img id="packImg" src="assets/pack.png">
<video id="bgVideo" src="assets/tunnel.mp4" muted playsinline preload="auto"></video>
<img id="bgFinal" src="assets/bg_final.jpg">

<button id="openBtn">OPEN</button>

<div id="flag" class="center" style="display:none">
  <img id="flagImg" width="120">
</div>
<div id="pos" class="center" style="display:none;font-size:42px;font-weight:900;"></div>
<div id="club" class="center" style="display:none">
  <img id="clubImg" width="120">
</div>
<div id="card" class="center">
  <img id="cardImg">
</div>

<div id="inventoryBtn">📦</div>
<div id="inventory">
  <div id="closeInv">✖</div>
  <h2>BỘ SƯU TẬP</h2>
  <div id="inventoryList"></div>
</div>

<!-- ===== SOUND ===== -->
<audio id="sFlag" src="assets/sounds/flag.mp3"></audio>
<audio id="sPos" src="assets/sounds/pos.mp3"></audio>
<audio id="sClub" src="assets/sounds/club.mp3"></audio>
<audio id="sCard" src="assets/sounds/card.mp3"></audio>
<audio id="music" src="assets/music/bg.mp3" loop></audio>

<!-- ================= SCRIPT ================= -->
<script>
/* ===== LOADING LOGIC ===== */
const loadingScene = document.getElementById("loadingScene");
const loadingText  = document.getElementById("loadingText");

let fakeProgress = 0;

/* fake loading % cho mượt */
const loadingInterval = setInterval(()=>{
  fakeProgress += Math.random()*12;
  if(fakeProgress > 90) fakeProgress = 90;
  loadingText.innerText = `Loading ${Math.floor(fakeProgress)}%`;
}, 200);

/* danh sách asset cần load */
const assets = [
  "assets/pack.png",
  "assets/bg_start.jpg",
  "assets/bg_final.jpg",
  "assets/tunnel.mp4",
  "assets/music/bg.mp3"
];

let loaded = 0;

function finishLoading(){
  clearInterval(loadingInterval);
  loadingText.innerText = "Loading 100%";
  setTimeout(()=>{
    loadingScene.style.opacity = "0";
    loadingScene.style.transition = ".6s";
    setTimeout(()=> loadingScene.remove(),600);
  },400);
}

function assetLoaded(){
  loaded++;
  if(loaded >= assets.length){
    finishLoading();
  }
}

/* FAIL SAFE – tối đa 4.5s */
setTimeout(()=>{
  finishLoading();
}, 4500);
/* preload */
assets.forEach(src=>{
  if(src.endsWith(".mp4") || src.endsWith(".mp3")){
  const media = document.createElement(src.endsWith(".mp4") ? "video" : "audio");
  media.src = src;
  media.preload = "auto";
  media.onloadeddata = assetLoaded;
  media.onerror = assetLoaded;
  }
  else{
    const img = new Image();
    img.src = src;
    img.onload = assetLoaded;
  }
});
/* ===== DEVICE & ROTATE ===== */
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const rotateNotice=document.getElementById("rotateNotice");

function checkOrientation(){
  if(!isMobile) return;
  rotateNotice.style.display =
    window.innerHeight>window.innerWidth?"flex":"none";
}
window.addEventListener("resize",checkOrientation);
window.addEventListener("orientationchange",checkOrientation);
checkOrientation();

/* ===== MUSIC ===== */
const music=document.getElementById("music");
function startMusic(){
  music.volume=0.5;
  music.play().catch(()=>{});
  document.removeEventListener("click",startMusic);
}
document.addEventListener("click",startMusic);

/* ===== DATA ===== */
let currentUser="guest";
const players=[
 {flag:"assets/flags/vn.png",pos:"HN",club:"assets/clubs/a2.png",card:"assets/cards/nn.png",weight:25},
 {flag:"assets/flags/vn.png",pos:"LB",club:"assets/clubs/a2.png",card:"assets/cards/trandat.png",weight:40},
 {flag:"assets/flags/vn.png",pos:"CAM",club:"assets/clubs/a2.png",card:"assets/cards/dth.png",weight:20},
 {flag:"assets/flags/vn.png",pos:"CB",club:"assets/clubs/a2.png",card:"assets/cards/ducanh.png",weight:100},
 {flag:"assets/flags/vn.png",pos:"CB",club:"assets/clubs/a2.png",card:"assets/cards/va.png",weight:100},
 {flag:"assets/flags/vn.png",pos:"CM",club:"assets/clubs/a2.png",card:"assets/cards/bk.png",weight:10},
 {flag:"assets/flags/vn.png",pos:"RB",club:"assets/clubs/a2.png",card:"assets/cards/thanh.png",weight:50},
 {flag:"assets/flags/vn.png",pos:"RB",club:"assets/clubs/a2.png",card:"assets/cards/huan.png",weight:90},
 {flag:"assets/flags/vn.png",pos:"GK",club:"assets/clubs/a2.png",card:"assets/cards/gau.png",weight:30},
];
const SPECIAL_CARD = {
  flag:"assets/flags/vn.png",
  pos:"⭐",
  club:"assets/clubs/a2.png",
  card:"assets/cards/special.png",
  isSpecial:true
};
function randomPlayer(){
  const total=players.reduce((s,p)=>s+p.weight,0);
  let r=Math.random()*total;
  for(const p of players){
    if(r<p.weight) return p;
    r-=p.weight;
  }
}

/* ===== DOM ===== */
const packImg=document.getElementById("packImg");
const openBtn=document.getElementById("openBtn");
const bgVideo=document.getElementById("bgVideo");
const bgStart=document.getElementById("bgStart");
const bgFinal=document.getElementById("bgFinal");
const flag=document.getElementById("flag");
const flagImg=document.getElementById("flagImg");
const posDiv=document.getElementById("pos");
const club=document.getElementById("club");
const clubImg=document.getElementById("clubImg");
const card=document.getElementById("card");
const cardImg=document.getElementById("cardImg");

const sFlag=document.getElementById("sFlag");
const sPos=document.getElementById("sPos");
const sClub=document.getElementById("sClub");
const sCard=document.getElementById("sCard");
[sFlag,sPos,sClub,sCard].forEach(s=>s.preload="auto");

let cardVisible=false;

/* ===== OPEN ===== */
openBtn.onclick=()=>{
  openBtn.style.display="none";
  packImg.style.animation="none";
  packImg.offsetHeight;
  packImg.classList.add("pack-open");

  setTimeout(()=>{
    packImg.style.display="none";
    bgStart.style.display="none";
    bgVideo.style.display="block";
    bgVideo.currentTime=0;
    bgVideo.play();

    const p=randomPlayer();

    setTimeout(()=>{ flagImg.src=p.flag; flag.style.display="block"; sFlag.play(); },1200);
    setTimeout(()=>{ flag.style.display="none"; posDiv.innerText=p.pos; posDiv.style.display="block"; sPos.play(); },3000);
    setTimeout(()=>{ posDiv.style.display="none"; clubImg.src=p.club; club.style.display="block"; sClub.play(); },4800);

    setTimeout(()=>{
      club.style.display="none";
      bgVideo.style.display="none";
      bgFinal.style.display="block";
      showCard(p);
      /* ===== FLASH + SHAKE ===== */
      const flash = document.getElementById("flash");
      flash.classList.remove("flash-anim");
      void flash.offsetHeight;
      flash.classList.add("flash-anim");

      card.classList.remove("shake");
      void card.offsetHeight;
      card.classList.add("shake");

      /* sound */
      sCard.currentTime = 0;
      sCard.play();

      saveCard(p.card);
    },7000);
  },1800);
};

/* ===== EXIT ===== */
function exitPack(){
  if(!cardVisible) return;
  cardVisible=false;
  card.style.display="none";
  bgFinal.style.display="none";
  bgStart.style.display="block";
  packImg.style.display="block";
  packImg.classList.remove("pack-open");
  packImg.style.animation="";
  openBtn.style.display="block";
}
document.addEventListener("click",()=>{ if(cardVisible) exitPack(); });

/* ===== SAVE & INVENTORY ===== */
function saveCard(path){
  const key="cards_"+currentUser;
  let list=JSON.parse(localStorage.getItem(key))||[];
  const exist=list.find(i=>i.card===path);
  exist?exist.count++:list.push({card:path,count:1});
  localStorage.setItem(key,JSON.stringify(list));
}

const inventoryBtn=document.getElementById("inventoryBtn");
const inventory=document.getElementById("inventory");
const closeInv=document.getElementById("closeInv");

inventoryBtn.onclick=()=>{
  inventory.style.display="flex";
  renderInventory();
};
closeInv.onclick=()=>inventory.style.display="none";

function renderInventory(){
  const list=JSON.parse(localStorage.getItem("cards_"+currentUser))||[];
  const box=document.getElementById("inventoryList");
  box.innerHTML="";
  list.forEach(i=>{
    const d=document.createElement("div");
    d.style.position="relative";
    d.style.margin="8px";
    d.innerHTML=`<img src="${i.card}"><div style="
      position:absolute;bottom:0;right:0;
      background:red;padding:2px 6px;font-size:12px">x${i.count}</div>`;
    box.appendChild(d);
  });
}
/* ================= ADMIN ================= */
const ADMIN_PASS = "khanhdz"; // 🔑 đổi mật khẩu tại đây

let nextForcedCard = null;
let noDuplicateMode = false;

/* DOM */
const adminBtn = document.getElementById("adminBtn");
const adminPanel = document.getElementById("adminPanel");
const closeAdmin = document.getElementById("closeAdmin");
const adminLogin = document.getElementById("adminLogin");
const adminControls = document.getElementById("adminControls");
const adminPass = document.getElementById("adminPass");
const adminLoginBtn = document.getElementById("adminLoginBtn");
const adminCardList = document.getElementById("adminCardList");
const noDupToggle = document.getElementById("noDupToggle");

/* open / close */
adminBtn.onclick = ()=> adminPanel.style.display="flex";
closeAdmin.onclick = ()=> adminPanel.style.display="none";

/* login */
adminLoginBtn.onclick = ()=>{
  if(adminPass.value === ADMIN_PASS){
    adminLogin.style.display="none";
    adminControls.style.display="block";
    noDupToggle.checked = noDuplicateMode;
    renderAdminCards();
  }else{
    alert("Sai mật khẩu admin");
  }
};

/* toggle no duplicate */
noDupToggle.onchange = ()=>{
  noDuplicateMode = noDupToggle.checked;
};

/* render admin card list */
function renderAdminCards(){
  adminCardList.innerHTML="";
  nextForcedCard = null;

  players.forEach(p=>{
    const img=document.createElement("img");
    img.src=p.card;
    img.onclick=()=>{
      document
        .querySelectorAll("#adminCardList img")
        .forEach(i=>i.classList.remove("selected"));
      img.classList.add("selected");
      nextForcedCard = p;
    };
    adminCardList.appendChild(img);
  });
}

/* ================= INVENTORY HELPER ================= */
function getInventory(){
  return JSON.parse(localStorage.getItem("cards_"+currentUser)) || [];
}

/* ================= RANDOM (ADMIN + NO DUP) ================= */
function randomPlayer(){

  /* 1️⃣ ADMIN FORCE – ƯU TIÊN CAO NHẤT */
  if(nextForcedCard){
    const p = nextForcedCard;
    nextForcedCard = null;
    return p;
  }

  /* 2️⃣ KHÔNG TRÙNG – DỰA TRÊN KHO */
  if(noDuplicateMode){
    const owned = new Set(getInventory().map(i=>i.card));
    const available = players.filter(p=>!owned.has(p.card));
    if(available.length > 0){
      return available[Math.floor(Math.random()*available.length)];
    }
  }

  /* 3️⃣ RANDOM GỐC THEO WEIGHT */
  const total = players.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for(const p of players){
    if(r < p.weight) return p;
    r -= p.weight;
  }
}
/* ===== RESET INVENTORY ===== */
const resetInventoryBtn = document.getElementById("resetInventoryBtn");

resetInventoryBtn.onclick = ()=>{
  const ok = confirm(
    "⚠️ Reset toàn bộ kho thẻ?\nHành động này KHÔNG thể hoàn tác!"
  );
  if(!ok) return;

  localStorage.removeItem("cards_" + currentUser);

  alert("✅ Đã reset kho thẻ");
};
const postSpecialVideo = document.getElementById("postSpecialCutscene");

function showCard(p){

  /* ===== HIỆN CARD NHƯ BÌNH THƯỜNG ===== */
  cardImg.src = p.card;
  card.style.display = "block";
  cardVisible = true;

  /* flash + rung giữ nguyên */
  const flash = document.getElementById("flash");
  flash.classList.remove("flash-anim");
  void flash.offsetHeight;
  flash.classList.add("flash-anim");

  card.classList.remove("shake");
  void card.offsetHeight;
  card.classList.add("shake");

  sCard.currentTime = 0;
  sCard.play();

  saveCard(p.card);

  /* ===== NẾU LÀ THẺ ĐẶC BIỆT → CUTSCENE SAU ===== */
  if(p.isSpecial){
    setTimeout(()=>{
      card.style.display = "none";

      postSpecialVideo.style.display = "block";
      postSpecialVideo.currentTime = 0;
      postSpecialVideo.muted = false;
      postSpecialVideo.play();

      postSpecialVideo.onended = ()=>{
        postSpecialVideo.style.display = "none";
        card.style.display = "block";
      };
    },800); // delay để người chơi kịp thấy card
  }
}
const forceSpecialBtn = document.getElementById("forceSpecialBtn");

forceSpecialBtn.onclick = ()=>{
  nextForcedCard = SPECIAL_CARD;

  // bỏ chọn card thường nếu có
  document
    .querySelectorAll("#adminCardList img")
    .forEach(i=>i.classList.remove("selected"));

  alert("⭐ Thẻ ĐẶC BIỆT đã được chọn cho lần mở tiếp theo");
};
</script>

</body>
</html>
