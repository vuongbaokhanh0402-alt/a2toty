<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A2 IN MY HEART</title>

<style>
/* background tĩnh */
#bgStart{
  position:fixed;
  inset:0;
  background:url("assets/bg_start.jpg") center/cover no-repeat;
  z-index:-2;
}

/* pack ở giữa */
#packImg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(1);

  height: min(88vh, 680px); /* 👈 QUAN TRỌNG */
  width: auto;              /* giữ tỉ lệ gốc */

  animation:idle 2.5s infinite ease-in-out;
  pointer-events:none;
  will-change: transform, filter;
  background: transparent;
}
/* animation idle */
@keyframes idle{
  0%{ transform:translate(-50%,-50%) scale(1); }
  50%{ transform:translate(-50%,-50%) scale(1.08); }
  100%{ transform:translate(-50%,-50%) scale(1); }
}

/* animation glow + thu nhỏ */
@keyframes packOpenAnim{
  0%{
    transform:translate(-50%,-50%) scale(1);
    filter:drop-shadow(0 0 0px white);
  }

  40%{
    transform:translate(-50%,-50%) scale(1.08);
    filter:drop-shadow(0 0 15px white)
           drop-shadow(0 0 30px white);
  }

  100%{
    transform:translate(-50%,-50%) scale(0.9);
    filter:drop-shadow(0 0 35px white)
           drop-shadow(0 0 70px white);
  }
}

.pack-open{
  animation:packOpenAnim 2.2s ease forwards !important;
}
html,body{
  margin:0;
  padding:0;
  background:black;
  font-family:arial;
  overflow:hidden;
  color:white;
}

/* background */
#bgStart,#bgVideo,#bgFinal{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
#bgVideo,#bgFinal{ display:none; }

/* giữa */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

/* OPEN */
#openBtn{
  position:fixed;
  bottom:40px;              /* thấp xuống thêm */
  left:50%;
  transform:translateX(-50%);

  padding:16px 50px;
  font-size:20px;
  border:none;
  border-radius:50px;

  background:#ffd700;       /* vàng */
  color:white;              /* chữ trắng */
  font-weight:bold;

  box-shadow:none;          /* bỏ glow */
}


/* thẻ */
#card{ display:none; }
#card img{ width:240px; }

/* icon kho */
#inventoryBtn{
  position:fixed;
  top:10px;
  right:10px;
  font-size:24px;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:10px;
}

/* popup kho */
#inventory{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
  z-index:10;
}

#closeInv{
  position:absolute;
  top:10px;
  right:15px;
  font-size:24px;
}

#inventoryList{
  margin-top:40px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}
#inventoryList img{
  width:90px;
}
</style>
</head>

<body>

<!-- BG -->
<!-- BACKGROUND TĨNH -->
<div id="bgStart"></div>

<!-- ẢNH PACK -->
<img id="packImg" src="assets/pack.png">
<video id="bgVideo" src="assets/tunnel.mp4" muted></video>
<img id="bgFinal" src="assets/bg_final.jpg">

<!-- OPEN -->
<button id="openBtn">OPEN</button>

<!-- FLAG -->
<div id="flag" class="center" style="display:none">
  <img id="flagImg" width="120">
</div>

<!-- POS -->
<div id="pos" class="center" style="display:none;font-size:42px;font-weight:900;"></div>

<!-- CLUB -->
<div id="club" class="center" style="display:none">
  <img id="clubImg" width="120">
</div>

<!-- CARD -->
<div id="card" class="center">
  <img id="cardImg">
</div>

<!-- ICON -->
<div id="inventoryBtn">📦</div>

<!-- INVENTORY -->
<div id="inventory">
  <div id="closeInv">✖</div>
  <h2>BỘ SƯU TẬP</h2>
  <div id="inventoryList"></div>
</div>

<!-- SOUND -->
<audio id="sFlag" src="assets/sounds/flag.mp3"></audio>
<audio id="sPos" src="assets/sounds/pos.mp3"></audio>
<audio id="sClub" src="assets/sounds/club.mp3"></audio>
<audio id="sCard" src="assets/sounds/card.mp3"></audio>

<!-- MUSIC -->
<audio id="music" src="assets/music/bg.mp3" loop></audio>

<script>
/* ================= MUSIC ================= */
const music=document.getElementById("music");
function startMusic(){
  music.volume=0.5;
  music.play().catch(()=>{});
  document.removeEventListener("click",startMusic);
  document.removeEventListener("touchstart",startMusic);
}
document.addEventListener("click",startMusic);
document.addEventListener("touchstart",startMusic);

/* ================= USER ================= */
let currentUser="guest";

/* ================= DATA ================= */
const players=[
 {flag:"assets/flags/vn.png",pos:"HN",club:"assets/clubs/a2.png",card:"assets/cards/nn.png",weight:25},
 {flag:"assets/flags/vn.png",pos:"LB",club:"assets/clubs/a2.png",card:"assets/cards/trandat.png",weight:50},
 {flag:"assets/flags/vn.png",pos:"CAM",club:"assets/clubs/a2.png",card:"assets/cards/dth.png",weight:10},
 {flag:"assets/flags/vn.png",pos:"CB",club:"assets/clubs/a2.png",card:"assets/cards/ducanh.png",weight:125},
 {flag:"assets/flags/vn.png",pos:"CB",club:"assets/clubs/a2.png",card:"assets/cards/va.png",weight:100},
 {flag:"assets/flags/vn.png",pos:"CM",club:"assets/clubs/a2.png",card:"assets/cards/bk.png",weight:10},
 {flag:"assets/flags/vn.png",pos:"RB",club:"assets/clubs/a2.png",card:"assets/cards/thanh.png",weight:50},
];

function randomPlayer(){
  const total=players.reduce((s,p)=>s+p.weight,0);
  let r=Math.random()*total;
  for(const p of players){
    if(r<p.weight) return p;
    r-=p.weight;
  }
}

/* ================= DOM ================= */
const openBtn=document.getElementById("openBtn");
const bgStart=document.getElementById("bgStart");
const bgVideo=document.getElementById("bgVideo");
const bgFinal=document.getElementById("bgFinal");
const packImg = document.getElementById("packImg");

const flag=document.getElementById("flag");
const flagImg=document.getElementById("flagImg");
const posDiv=document.getElementById("pos");
const club=document.getElementById("club");
const clubImg=document.getElementById("clubImg");

const card=document.getElementById("card");
const cardImg=document.getElementById("cardImg");

const sFlag=document.getElementById("sFlag");
const sPos=document.getElementById("sPos");
const sClub=document.getElementById("sClub");
const sCard=document.getElementById("sCard");

let cardVisible=false;

/* ================= OPEN ================= */
 openBtn.onclick=()=>{

  /* 1️⃣ Ẩn nút */
  openBtn.style.display="none";

  /* 2️⃣ Hiệu ứng pack thu nhỏ + phát sáng */
  // tắt idle trước
  packImg.style.animation = "none";
  packImg.offsetHeight; // force reflow để reset animation

  // thêm animation mở
  packImg.classList.add("pack-open");

  /* 3️⃣ Delay 1 giây rồi mới vào hầm */
  setTimeout(()=>{

    packImg.style.display="none";
    bgStart.style.display="none";

    bgVideo.style.display="block";

    bgVideo.pause();
    bgVideo.currentTime = 0;
    bgVideo.load();
    bgVideo.play();

    const p=randomPlayer();

    setTimeout(()=>{
     flagImg.src=p.flag;
     flag.style.display="block";
     sFlag.currentTime=0; 
     sFlag.play();
    },1200);

    setTimeout(()=>{
     flag.style.display="none";
     posDiv.innerText=p.pos;
     posDiv.style.display="block";
     sPos.currentTime=0; 
     sPos.play();
    },3000);

    setTimeout(()=>{
     posDiv.style.display="none";
     clubImg.src=p.club;
     club.style.display="block";
     sClub.currentTime=0; 
     sClub.play();
    },4800);

    setTimeout(()=>{
     club.style.display="none";
     bgVideo.style.display="none";
     bgFinal.style.display="block";

     cardImg.src=p.card;
     card.style.display="block";
     cardVisible=true;

     sCard.currentTime=0;
     sCard.play();

     saveCard(p.card);
    },7000);
  },1800); // 👈 delay trước khi vào hầm

};
/* ================= EXIT ================= */
function exitPack(){
  if(!cardVisible) return;
  cardVisible=false;

  card.style.display="none";
  bgFinal.style.display="none";
  bgStart.style.display="block";

  packImg.style.display="block";

  // ✅ RESET ANIMATION CHUẨN
  packImg.classList.remove("pack-open");
  packImg.style.animation = "none";
  packImg.offsetHeight; // force reflow
  packImg.style.animation = ""; // trả lại animation CSS

  openBtn.style.display="block";
}
document.addEventListener("click",exitPack);
document.addEventListener("touchstart",exitPack);

/* ================= SAVE ================= */
function saveCard(path){
  const key="cards_"+currentUser;
  let list=JSON.parse(localStorage.getItem(key))||[];

  const exist=list.find(i=>i.card===path);
  if(exist) exist.count++;
  else list.push({card:path,count:1});

  localStorage.setItem(key,JSON.stringify(list));
}

/* ================= INVENTORY ================= */
const inventoryBtn=document.getElementById("inventoryBtn");
const inventory=document.getElementById("inventory");
const closeInv=document.getElementById("closeInv");

inventoryBtn.onclick=()=>{
  inventory.style.display="flex";
  renderInventory();
};
closeInv.onclick=()=>{
  inventory.style.display="none";
};

function renderInventory(){
  const key="cards_"+currentUser;
  const list=JSON.parse(localStorage.getItem(key))||[];

  const box=document.getElementById("inventoryList");
  box.innerHTML="";

  list.forEach(item=>{
    const wrap=document.createElement("div");
    wrap.style.position="relative";
    wrap.style.margin="8px";

    const img=document.createElement("img");
    img.src=item.card;

    const count=document.createElement("div");
    count.innerText="x"+item.count;
    count.style.position="absolute";
    count.style.bottom="0";
    count.style.right="0";
    count.style.background="red";
    count.style.padding="2px 6px";
    count.style.fontSize="12px";

    wrap.appendChild(img);
    wrap.appendChild(count);
    box.appendChild(wrap);
  });
}
</script>

</body>
</html>
